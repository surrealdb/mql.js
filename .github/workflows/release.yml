name: Release

# Publishes the package to npm when a version tag (e.g. `v0.1.0`) is pushed.
# The tag must match the `version` in package.json. Prerelease tags
# (containing a hyphen, e.g. `v0.2.0-beta.1`) publish under the `next`
# dist-tag instead of `latest`.
#
# Requires the `NPM_TOKEN` repository secret (an npm automation token with
# publish access to the `@surrealdb` scope).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestations
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js (npm registry auth + provenance)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Releasing ${PKG_VERSION}"

      - name: Run lint checks
        run: bun run quality:check

      - name: Run TypeScript type check
        run: bun run type-check

      - name: Run unit tests
        run: bun run test:unit

      - name: Build distributable
        run: bun run build

      - name: Verify build output (incl. type declarations)
        run: |
          for f in dist/index.d.ts dist/index.mjs dist/index.cjs dist/index.bundled.mjs; do
            test -f "$f" || { echo "::error::expected build artifact $f was not generated"; exit 1; }
          done

      - name: Publish to npm
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Prerelease tag detected; publishing under the 'next' dist-tag."
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
